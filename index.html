<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bus &amp; Boots Grenoble — hikes you can reach by bus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<style>
:root{
  --paper:#F7F6F1; --ink:#1E2A2B; --muted:#6B7473;
  --chartreuse:#4A7C59; --vercors:#2C5F8A; --belledonne:#5A5F6E;
  --ok:#4A7C59; --warn:#C97B2D; --bad:#B4453A;
  --card:#FFFFFF; --line:#E3E1D8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',sans-serif;background:var(--paper);color:var(--ink);line-height:1.45;
  background-image:repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(30,42,43,.03) 40px),
                   repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(30,42,43,.03) 40px);}
header{padding:28px 20px 14px;max-width:1080px;margin:0 auto}
h1{font-family:'Barlow Condensed';font-weight:700;font-size:clamp(2rem,5vw,3rem);letter-spacing:.01em;text-transform:uppercase}
h1 .accent{color:var(--vercors)} h1 .place{color:var(--muted)}
.tagline{font-family:'Barlow Condensed';font-weight:600;font-size:.8rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--chartreuse);margin-top:1px}
.sub{color:var(--muted);font-size:.95rem;margin-top:4px;display:flex;align-items:center;gap:5px}
.validity{display:inline-block;margin-top:10px;font-size:.8rem;background:var(--ink);color:var(--paper);
  padding:4px 10px;border-radius:3px;font-family:'Barlow Condensed';letter-spacing:.04em}
#map{max-width:1080px;margin:14px auto 0;height:320px;border:1px solid var(--line);border-radius:10px;z-index:0}
.map-cap{max-width:1080px;margin:6px auto 0;padding:0 20px;font-size:.78rem;color:var(--muted)}
.leaflet-container{font-family:'Barlow',sans-serif;background:var(--paper)}
.trailpin{color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;
  font-family:'Barlow Condensed';font-weight:700;font-size:.68rem;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin-chartreuse{background:var(--chartreuse)} .pin-vercors{background:var(--vercors)} .pin-belledonne{background:var(--belledonne)}
.pin-grenoble{background:var(--warn);width:14px;height:14px}
.pp-name{font-family:'Barlow Condensed';font-weight:700;font-size:1.05rem;line-height:1.1}
.pp-meta{font-size:.82rem;color:var(--muted);margin-top:3px}
.pp-link{font-size:.82rem;color:var(--vercors);cursor:pointer;text-decoration:underline;margin-top:5px;
  display:inline-block;background:none;border:none;padding:0;font-family:inherit}
.filters{max-width:1080px;margin:16px auto 6px;padding:0 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters label{font-family:'Barlow Condensed';font-weight:600;font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:5px 14px;cursor:pointer;
  font-family:'Barlow Condensed';font-weight:600;font-size:.9rem;letter-spacing:.03em;transition:all .15s}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
select{border:1.5px solid var(--line);border-radius:6px;padding:5px 8px;font-family:'Barlow',sans-serif;background:var(--card)}
.check{display:flex;align-items:center;gap:5px;font-size:.88rem;cursor:pointer;user-select:none}
.count{max-width:1080px;margin:8px auto 0;padding:0 20px;font-size:.85rem;color:var(--muted)}
main{max-width:1080px;margin:0 auto;padding:10px 20px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(480px,1fr));gap:16px}
@media(max-width:560px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;position:relative;
  border-top:4px solid var(--massif,var(--ink));transition:box-shadow .15s;scroll-margin-top:20px}
.card:hover{box-shadow:0 3px 14px rgba(30,42,43,.09)}
.card.flash{box-shadow:0 0 0 3px var(--massif)}
.card.done{opacity:.72}
.card.done .tname::after{content:" ✓";color:var(--ok)}
.toprow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.tname{font-family:'Barlow Condensed';font-weight:700;font-size:1.3rem;line-height:1.1}
.massif-tag{font-family:'Barlow Condensed';font-weight:600;font-size:.78rem;text-transform:uppercase;
  letter-spacing:.08em;color:var(--massif)}
.lozenge{flex-shrink:0;font-family:'Barlow Condensed';font-weight:700;font-size:1rem;background:var(--ink);
  color:#fff;border-radius:6px;padding:3px 10px;letter-spacing:.02em}
.stats{display:flex;gap:14px;margin:10px 0 4px;flex-wrap:wrap}
.stat{font-size:.9rem}.stat b{font-family:'Barlow Condensed';font-size:1.05rem;font-weight:700}
.stat span{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;display:block}
.opts{margin:12px 0 4px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.opts .oh,.opts .orow{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;padding:6px 10px;align-items:center}
.opts .oh{background:var(--paper);font-family:'Barlow Condensed';font-weight:600;font-size:.72rem;
  text-transform:uppercase;letter-spacing:.05em;color:var(--muted);align-items:start}
.opts .oh em{display:block;font-style:normal;font-family:'Barlow',sans-serif;font-weight:600;
  font-size:.76rem;text-transform:none;letter-spacing:0;color:var(--ink);line-height:1.2;margin-top:1px}
.opts .orow{border-top:1px solid var(--line);font-size:.9rem;font-variant-numeric:tabular-nums}
.opts .orow b{font-family:'Barlow Condensed';font-weight:700}
.spare{font-family:'Barlow Condensed';font-weight:700;font-size:.82rem;padding:2px 7px;border-radius:4px;text-align:center;white-space:nowrap}
.spare.ok{background:#E4EFE7;color:var(--ok)} .spare.warn{background:#FBEEDD;color:var(--warn)} .spare.bad{background:#F3DDDB;color:var(--bad)}
.busline{font-size:.85rem;color:var(--muted);margin-top:6px}
.busline b{color:var(--ink)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.badge{font-family:'Barlow Condensed';font-weight:600;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;
  border-radius:4px;padding:3px 8px;border:1px solid var(--line);color:var(--muted)}
.badge.resa{background:#FBEEDD;border-color:#E8CBA4;color:#8A5A1E}
.badge.bus{background:#E4EFE7;border-color:#A9C9B4;color:#2F6140}
.badge.est{background:#FBEEDD;border-color:#E8CBA4;color:#8A5A1E}
.badge.meas{background:#EEF3F7;border-color:#BBD0E0;color:#2C5F8A}
.badge.verified{background:#EEF3F7;border-color:#BBD0E0;color:#2C5F8A}
.badge a{color:inherit}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.gpx{font-size:.85rem;color:var(--vercors);text-decoration:none;font-weight:500}
.gpx:hover{text-decoration:underline}
.donebtn{font-family:'Barlow Condensed';font-weight:600;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;
  border:1.5px solid var(--line);background:none;border-radius:6px;padding:5px 12px;cursor:pointer;color:var(--muted)}
.donebtn.on{background:var(--ok);border-color:var(--ok);color:#fff}
.route{font-size:.86rem;color:var(--muted);margin-top:2px}
.info{font-size:.83rem;color:var(--ink);margin-top:8px;line-height:1.4}
.info .lbl{display:inline-block;min-width:62px;font-family:'Barlow Condensed';font-weight:700;font-size:.74rem;
  text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.info.book{background:#FBEEDD;border:1px solid #E8CBA4;border-radius:6px;padding:6px 8px;color:#6B4515}
.info.book a{color:#8A5A1E;font-weight:600}
.links{display:flex;gap:14px;flex-wrap:wrap}
.cutnote{font-size:.82rem;color:var(--warn);font-weight:500;margin-top:8px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
footer{max-width:1080px;margin:0 auto;padding:0 20px 30px;font-size:.78rem;color:var(--muted)}
footer a{color:var(--muted)}
.chip:focus-visible,.donebtn:focus-visible,select:focus-visible{outline:2px solid var(--vercors);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Bus <span class="accent">&amp;</span> Boots <span class="place">Grenoble</span></h1>
  <div class="tagline">Rando Grenoble Sans Voiture</div>
  <div class="sub">Day hikes from Grenoble — accessible by bus
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="3" fill="#fff" stroke="#2C5F8A" stroke-width="1.6"/><rect x="6" y="7" width="4.5" height="4" rx="1" fill="#2C5F8A"/><rect x="13.5" y="7" width="4.5" height="4" rx="1" fill="#2C5F8A"/><circle cx="8" cy="19" r="2" fill="#1E2A2B"/><circle cx="16" cy="19" r="2" fill="#1E2A2B"/></svg>
  </div>
  <div class="validity" id="validity"></div>
</header>

<div id="map"></div>
<div class="map-cap">Pins mark each trailhead bus stop, coloured by massif. Click a pin to jump to that trail. Grenoble is the orange dot.</div>

<div class="filters" id="filters">
  <label>Massif</label>
  <button class="chip on" data-massif="all">All</button>
  <button class="chip" data-massif="Chartreuse">Chartreuse</button>
  <button class="chip" data-massif="Vercors">Vercors</button>
  <button class="chip" data-massif="Belledonne">Belledonne</button>
  <label>Max walk</label>
  <select id="maxdur">
    <option value="99">Any</option><option value="3">≤ 3 h</option>
    <option value="5">≤ 5 h</option><option value="7">≤ 7 h</option>
  </select>
  <label>From stop</label>
  <select id="maxappr">
    <option value="99">Any</option><option value="0.3">≤ 300 m</option>
    <option value="1">≤ 1 km</option><option value="2">≤ 2 km</option>
  </select>
  <label class="check"><input type="checkbox" id="feasonly" checked> Doable on Saturday</label>
  <label class="check"><input type="checkbox" id="busonly"> Park &ldquo;Rando Bus&rdquo; only</label>
  <label class="check"><input type="checkbox" id="hidedone"> Hide done</label>
</div>

<div class="count" id="count"></div>
<main id="grid"></main>
<footer id="foot"></footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const MASSIF_COLOR={Chartreuse:'var(--chartreuse)',Vercors:'var(--vercors)',Belledonne:'var(--belledonne)'};
const doneKey='busboots_done';
const getDone=()=>{try{return JSON.parse(localStorage.getItem(doneKey))||{}}catch(e){return {}}};
const setDone=d=>{try{localStorage.setItem(doneKey,JSON.stringify(d))}catch(e){}};

let TRAILS=null, STOPS=null, MAP=null, MARKERS={};
let state={massif:'all',maxdur:99,maxappr:99,feasonly:true,busonly:false,hidedone:false};
const PACE=1.0, BUFFER_MIN=45;

const toMin=s=>{const[h,m]=s.split(':').map(Number);return h*60+m};
const hhmm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const durTxt=m=>{m=Math.abs(Math.round(m));return Math.floor(m/60)+'h'+String(m%60).padStart(2,'0')};
const fmtH=h=>{const hh=Math.floor(h),mm=Math.round((h-hh)*60);return mm?hh+'h'+String(mm).padStart(2,'0'):hh+'h'};
const deAcc=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

/* Trails reference stops by several different ids depending on their source:
   park trails use the GTFS stop_id; hand-verified trails use the old bus_ref
   key ("N62_colporte") while schedules.json stores those as
   "MANUAL_N62_colporte". Resolve by trying each, then by stop name. */
function resolveStop(t){
  if(!STOPS) return null;
  if(t.stop_id && STOPS[t.stop_id]) return STOPS[t.stop_id];
  if(t.stop_id && STOPS['MANUAL_'+t.stop_id]) return STOPS['MANUAL_'+t.stop_id];
  if(t.stop){
    const want=deAcc(t.stop);
    for(const k in STOPS){ if(deAcc(STOPS[k].stop)===want) return STOPS[k]; }
    for(const k in STOPS){ const s=deAcc(STOPS[k].stop);
      if(s.includes(want)||want.includes(s)) return STOPS[k]; }
  }
  return null;
}

/* For each Saturday departure, find the earliest return that clears
   arrival + walk to trail + hike + walk back + safety buffer. */
function options(t){
  const stop=resolveStop(t);
  if(!stop||!stop.saturday) return null;
  const out=stop.saturday.outbound||[], rets=(stop.saturday.returns||[]).map(r=>
    typeof r==='string'?{dep:r}:r);
  if(!out.length||!rets.length) return null;
  const walk = t.approach_min!=null ? t.approach_min
             : (t.approach_km!=null ? Math.round(t.approach_km/4*60) : 0);
  const hike = t.duration_h!=null ? Math.round(t.duration_h*60*PACE) : null;
  if(hike==null) return {rows:[],anyViable:false,stop,noDuration:true};
  const retMin=rets.map(r=>({m:toMin(r.dep),line:r.line})).sort((a,b)=>a.m-b.m);
  const rows=out.map(o=>{
    const arrive=toMin(o.arr), back=arrive+walk+hike+walk, need=back+BUFFER_MIN;
    let pick=null; for(const r of retMin){ if(r.m>=need){pick=r;break} }
    return {dep:o.dep,arr:o.arr,line:o.line||'',back,ret:pick?pick.m:null,spare:pick?pick.m-back:null};
  });
  return {rows,anyViable:rows.some(r=>r.ret!==null),stop,walk,hike};
}
const spareClass=s=>s===null?'bad':s>=90?'ok':'warn';
function bestSpare(t){const o=options(t);if(!o||!o.anyViable)return -1;
  return Math.max(...o.rows.map(r=>r.spare===null?-1:r.spare));}

function card(t){
  const done=getDone()[t.id];
  const color=MASSIF_COLOR[t.massif]||'var(--ink)';
  const o=options(t);
  const stop=o?o.stop:resolveStop(t);
  let mid='';
  if(!o){
    mid='<div class="cutnote">No Saturday schedule found for this stop — check M&nbsp;réso before travelling.</div>';
  }else if(o.noDuration){
    mid='<div class="cutnote">No walking duration published for this route, so feasibility cannot be computed.</div>';
  }else{
    const hidden=o.rows.filter(r=>r.ret===null).length;
    const rows=o.rows.filter(r=>r.ret!==null).map(r=>{
      const chg=r.line.includes('+')?'<br><small style="color:var(--warn);font-size:.72rem">1 change · '+r.line.replace('+',' → ')+'</small>':'';
      return '<div class="orow"><b>'+r.dep+chg+'</b><span>'+r.arr+'</span><b>'+hhmm(r.ret)+
        '</b><span class="spare '+spareClass(r.spare)+'">'+durTxt(r.spare)+' spare</span></div>';
    }).join('');
    const offStop=stop?stop.stop:'—';
    const note=hidden?'<div class="orow" style="grid-template-columns:1fr;color:var(--muted);font-size:.8rem">'+
      hidden+' later departure'+(hidden>1?'s':'')+' not shown — not enough time to return.</div>':'';
    mid='<div class="opts"><div class="oh"><span>Leave Gre.</span><span>Get off<em>'+offStop+
      '</em></span><span>Return from<em>'+offStop+'</em></span><span>Buffer</span></div>'+rows+note+'</div>';
  }

  const appr = t.approach_km!=null
    ? (t.approach_km<1 ? Math.round(t.approach_km*1000)+' m' : t.approach_km+' km')
    : '?';

  const lines=(stop&&stop.lines&&stop.lines.length)?stop.lines.join('/'):(t.lines||[]).join('/');
  // COST — always its own line. Open-data (Cars Region) stops carry no fare,
  // so state the standard rule instead of leaving it blank.
  const fareTxt = stop&&stop.fare ? stop.fare
    : 'Cars Région ticket, price by zone. Buy on board, by SMS (93222) or on the Oùra app.';
  const fare='<div class="info"><span class="lbl">Ticket</span>'+fareTxt+'</div>';
  // BOOKING — say plainly whether it is needed, and the rule for pass holders.
  let resa='';
  if(stop&&stop.booking){
    const b=stop.booking;
    resa='<div class="info book"><span class="lbl">Booking</span><b>'+b.summary+'.</b> '+b.rule+' '+b.who+
      (b.url?' <a href="'+b.url+'" target="_blank" rel="noopener">Book a seat →</a>':'')+'</div>';
  } else {
    resa='<div class="info"><span class="lbl">Booking</span>Not needed — just board.</div>';
  }

  return '<article id="card-'+t.id+'" class="card '+(done?'done':'')+'" style="--massif:'+color+'">'+
    '<div class="toprow"><div>'+
      '<div class="massif-tag">'+t.massif+'</div>'+
      '<div class="tname">'+t.name+'</div>'+
      (t.route_label?'<div class="route">'+t.route_label+'</div>':'')+
    '</div><div class="lozenge">'+(lines||'—')+'</div></div>'+

    '<div class="stats">'+
      '<div class="stat"><b>'+(t.distance_km??'?')+' km</b><span>distance</span></div>'+
      '<div class="stat"><b>'+(t.d_plus_m??'?')+' m</b><span>elevation gain</span></div>'+
      '<div class="stat"><b>'+(t.duration_h!=null?fmtH(t.duration_h):'?')+'</b><span>duration</span></div>'+
      '<div class="stat"><b>'+appr+'</b><span>stop→trail</span></div>'+
      (t.difficulty?'<div class="stat"><b>'+t.difficulty+'</b><span>grade</span></div>':'')+
    '</div>'+ mid +
    '<div class="busline">From <b>'+(stop?stop.stop:'—')+'</b></div>'+
    (t.note?'<div class="busline">'+t.note+'</div>':'')+
    '<div class="badges">'+
      (t.rando_bus?'<span class="badge bus">Rando Bus</span>':'')+
    '</div>'+ fare + resa +
    '<div class="actions">'+
      '<span class="links">'+
        (t.gpx_url?'<a class="gpx" href="'+t.gpx_url+'" target="_blank" rel="noopener">GPX track ↓</a>':'')+
        (t.pdf_url?'<a class="gpx" href="'+t.pdf_url+'" target="_blank" rel="noopener">Topo (PDF) →</a>':'')+
        (!t.gpx_url&&!t.pdf_url&&t.topo_url?'<a class="gpx" href="'+t.topo_url+'" target="_blank" rel="noopener">Topo &amp; GPX →</a>':'')+
      '</span>'+
      '<button class="donebtn '+(done?'on':'')+'" data-id="'+t.id+'">'+(done?'Done it':'Mark done')+'</button>'+
    '</div></article>';
}

function render(){
  if(!TRAILS) return;
  const done=getDone();
  const list=TRAILS.filter(t=>{
    if(state.massif!=='all'&&t.massif!==state.massif) return false;
    if(t.duration_h!=null&&t.duration_h>state.maxdur) return false;
    if(t.approach_km!=null&&t.approach_km>state.maxappr) return false;
    if(state.busonly&&!t.rando_bus) return false;
    if(state.hidedone&&done[t.id]) return false;
    if(state.feasonly&&bestSpare(t)<0) return false;
    return true;
  }).sort((a,b)=>bestSpare(b)-bestSpare(a));

  document.getElementById('count').textContent =
    list.length+' trail'+(list.length!==1?'s':'')+' · sorted by most breathing room before the last bus';
  document.getElementById('grid').innerHTML =
    list.length?list.map(card).join(''):'<div class="empty">No trails match — loosen a filter.</div>';
  document.querySelectorAll('.donebtn').forEach(b=>b.addEventListener('click',()=>{
    const d=getDone(); const id=b.dataset.id;
    if(d[id]) delete d[id]; else d[id]=1;
    setDone(d); render();
  }));
  updateMap(new Set(list.map(t=>t.id)));
}

function initMap(){
  if(typeof L==='undefined'){document.getElementById('map').style.display='none';return;}
  MAP=L.map('map',{scrollWheelZoom:false}).setView([45.17,5.72],10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:17,
    attribution:'© OpenStreetMap'}).addTo(MAP);
  L.marker([45.1885,5.7245],{icon:L.divIcon({className:'',
    html:'<div class="trailpin pin-grenoble"></div>',iconSize:[14,14],iconAnchor:[7,7]})})
    .addTo(MAP).bindPopup('<div class="pp-name">Grenoble</div><div class="pp-meta">Départ · 250 m</div>');
  const bounds=[[45.1885,5.7245]];
  TRAILS.forEach(t=>{
    const stop=resolveStop(t);
    const lat=(stop&&stop.lat)??t.lat, lng=(stop&&stop.lng)??t.lng;
    if(lat==null) return;
    bounds.push([lat,lng]);
    const lines=(stop&&stop.lines&&stop.lines[0])||(t.lines&&t.lines[0])||'•';
    const m=L.marker([lat,lng],{icon:L.divIcon({className:'',
      html:'<div class="trailpin pin-'+t.massif.toLowerCase()+'">'+lines+'</div>',
      iconSize:[24,24],iconAnchor:[12,12]})}).addTo(MAP);
    m.bindPopup('<div class="pp-name">'+t.name+'</div>'+
      '<div class="pp-meta">'+(t.distance_km??'?')+' km · '+(t.d_plus_m??'?')+' m elevation gain'+
      (stop?' · '+stop.stop:'')+'</div>'+
      '<button class="pp-link" onclick="jumpTo(\''+t.id+'\')">See departures ↓</button>');
    MARKERS[t.id]={marker:m,massif:t.massif};
  });
  MAP.fitBounds(bounds,{padding:[30,30]});
}
function updateMap(visible){
  if(!MAP) return;
  Object.entries(MARKERS).forEach(([id,o])=>{
    if(visible.has(id)) o.marker.addTo(MAP); else MAP.removeLayer(o.marker);
  });
}
window.jumpTo=function(id){
  const el=document.getElementById('card-'+id); if(!el) return;
  el.scrollIntoView({behavior:'smooth',block:'center'});
  el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),1400);
};

document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
  c.classList.add('on'); state.massif=c.dataset.massif; render();
}));
document.getElementById('maxdur').addEventListener('change',e=>{state.maxdur=+e.target.value;render()});
document.getElementById('maxappr').addEventListener('change',e=>{state.maxappr=+e.target.value;render()});
document.getElementById('feasonly').addEventListener('change',e=>{state.feasonly=e.target.checked;render()});
document.getElementById('busonly').addEventListener('change',e=>{state.busonly=e.target.checked;render()});
document.getElementById('hidedone').addEventListener('change',e=>{state.hidedone=e.target.checked;render()});

Promise.all([
  fetch('trails_merged.json').then(r=>{if(!r.ok)throw new Error('trails_merged.json ('+r.status+')');return r.json()}),
  fetch('schedules.json').then(r=>{if(!r.ok)throw new Error('schedules.json ('+r.status+')');return r.json()})
]).then(([tr,sc])=>{
  TRAILS=tr.trails; STOPS=sc.stops;
  const m=tr.meta||{};
  document.getElementById('validity').textContent =
    'Saturday schedules · '+(sc.feed_calendar_span||'')+' · '+(m.counts?m.counts.total+' trails':'');
  document.getElementById('foot').textContent =
    'Return shown = earliest bus after your hike + walk + 45-min buffer. Times from official timetables; always re-check before travelling.';
  initMap(); render();
}).catch(e=>{
  document.getElementById('grid').innerHTML =
    '<div class="empty">Could not load data — '+e.message+'<br>Make sure trails_merged.json and schedules.json sit next to index.html.</div>';
});
</script>
</body>
</html>
